services:
  api:
    image: fulfillment-demo:local
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

  db:
    restart: unless-stopped

  dashboard:
    image: fulfillment-demo:local
    build: .
    entrypoint: ["streamlit", "run", "frontend/app.py"]
    command: ["--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      FULFILLMENT_API_URL: http://api:8000
      FULFILLMENT_API_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      FULFILLMENT_API_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      FULFILLMENT_DEMO_REPORT: /app/artifacts/three_robot_run.json
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
